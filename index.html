<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MOI — App View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --cyan: #00f2fe;
      --magenta: #ff2a85;
      --violet: #8b5cf6;
      --px: 0;
      --py: 0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
    }
    body {
      background:
        radial-gradient(1200px 900px at 18% 8%, #17002f 0%, transparent 58%),
        radial-gradient(1000px 800px at 85% 95%, #00202e 0%, transparent 60%),
        radial-gradient(900px 700px at 80% 5%, #2a0033 0%, transparent 55%),
        #04040c;
      color: #fff;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .55;
      mix-blend-mode: screen;
      transform: translate3d(calc(var(--px)*-46px), calc(var(--py)*-46px), 0);
      transition: transform .6s cubic-bezier(.2,.8,.2,1);
      will-change: transform;
    }
    .b1 {
      width: 520px;
      height: 520px;
      left: -140px;
      top: -120px;
      background: radial-gradient(circle, #ff2a85 0%, rgba(255,42,133,0) 68%);
      animation: drift1 16s ease-in-out infinite alternate;
    }
    .b2 {
      width: 560px;
      height: 560px;
      right: -160px;
      bottom: -160px;
      background: radial-gradient(circle, #00f2fe 0%, rgba(0,242,254,0) 68%);
      animation: drift2 19s ease-in-out infinite alternate;
    }
    .b3 {
      width: 440px;
      height: 440px;
      left: 38%;
      top: 34%;
      background: radial-gradient(circle, #8b5cf6 0%, rgba(139,92,246,0) 70%);
      animation: drift3 22s ease-in-out infinite alternate;
      opacity: .45;
    }
    @keyframes drift1 { to { transform: translate(70px,60px) scale(1.18) } }
    @keyframes drift2 { to { transform: translate(-60px,-70px) scale(1.22) } }
    @keyframes drift3 { to { transform: translate(-50px,50px) scale(1.15) } }

    .stage {
      position: relative;
      z-index: 2;
      perspective: 1700px;
      perspective-origin: 50% 50%;
    }
    .phone {
      position: relative;
      width: min(392px, 92vw);
      height: min(812px, 92dvh);
      border-radius: 48px;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .frame-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 145%;
      aspect-ratio: 1;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      background: conic-gradient(from 0deg, #00f2fe, #8b5cf6, #ff2a85, #00f2fe);
      filter: blur(52px);
      opacity: .5;
      animation: spin 14s linear infinite;
      pointer-events: none;
    }
    @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg) } }

    .screen {
      position: absolute;
      inset: 0;
      border-radius: 48px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      padding: 30px 24px 26px;
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(0,242,254,.14) 0%, transparent 55%),
        radial-gradient(100% 60% at 50% 110%, rgba(255,42,133,.16) 0%, transparent 60%),
        linear-gradient(165deg, #0b0d1e 0%, #06070f 48%, #0c0716 100%);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 50px 100px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.03),
        inset 0 1px 0 rgba(255,255,255,.14), inset 0 -60px 90px -60px rgba(0,242,254,.35);
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      padding: 30px 24px 26px;
      transition: opacity .45s ease, transform .45s ease;
    }
    .view.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px);
    }

    .top { text-align: center; }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(46px, 13vw, 60px);
      letter-spacing: .14em;
      line-height: 1;
      background: linear-gradient(100deg, #a8fbff 0%, #00f2fe 22%, #a78bfa 52%, #ff2a85 82%, #ff9ecb 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 24px rgba(0,242,254,.45));
    }
    .tagline {
      margin-top: 10px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .36em;
      text-transform: uppercase;
      color: rgba(190,205,230,.55);
      text-indent: .36em;
    }

    .mascot-wrap {
      height: 220px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      position: relative;
    }
    .mascot {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 26px 38px rgba(255,42,133,.34)) drop-shadow(0 0 30px rgba(0,242,254,.22));
    }

    .card {
      position: relative;
      border-radius: 30px;
      padding: 22px 18px 20px;
      background: linear-gradient(165deg, rgba(255,255,255,.085) 0%, rgba(255,255,255,.018) 42%, rgba(255,255,255,.05) 100%);
      backdrop-filter: blur(26px) saturate(170%);
      -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid rgba(255,255,255,.11);
      box-shadow: 0 28px 64px -26px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.2), inset 0 -30px 60px -40px rgba(0,242,254,.55);
    }

    .divider {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,.4);
      margin-bottom: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .btn {
      position: relative;
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 18px;
      font-family: inherit;
      font-size: 15.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      overflow: hidden;
      transition: transform .35s ease, box-shadow .35s ease;
    }
    .btn + .btn { margin-top: 14px; }
    .btn-google { background: linear-gradient(180deg, #ffffff 0%, #eef1f7 100%); color: #0b1020; }
    .btn-facebook { background: linear-gradient(135deg, #2b8cff 0%, #1877f2 42%, #0052d4 100%); color: #fff; }
    .btn-primary { background: linear-gradient(135deg, #00f2fe 0%, #8b5cf6 55%, #ff2a85 100%); color: #fff; }
    .btn-logout { background: rgba(255,42,133,.16); color: #ff9ecb; border: 1px solid rgba(255,42,133,.4); margin-top: 16px; }

    .bottom { text-align: center; font-size: 11px; color: rgba(255,255,255,.5); }
    .bottom a { color: var(--cyan); text-decoration: none; }
    .problems { margin-bottom: 6px; }

    .p-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 34px;
      letter-spacing: .1em;
      background: linear-gradient(100deg, #00f2fe, #a78bfa, #ff2a85);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }
    .p-sub {
      text-align: center;
      margin-top: 6px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(190,205,230,.55);
    }
    .avatar-wrap {
      display: grid;
      place-items: center;
      margin: 14px 0 4px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid rgba(0,242,254,.7);
      box-shadow: 0 0 30px rgba(0,242,254,.55);
      background: #0b1020;
      display: grid;
      place-items: center;
      font-size: 32px;
      color: var(--cyan);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .profile-card {
      background: linear-gradient(165deg, rgba(255,255,255,.085) 0%, rgba(255,255,255,.02) 42%, rgba(255,255,255,.05) 100%);
      backdrop-filter: blur(26px);
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 26px;
      padding: 20px 18px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(170,190,215,.75);
      margin-bottom: 8px;
    }
    .select-wrap { position: relative; }
    .select-wrap i {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cyan);
      pointer-events: none;
    }
    select {
      width: 100%;
      height: 52px;
      padding: 0 42px 0 16px;
      border-radius: 14px;
      background: rgba(10,14,28,.85);
      color: #fff;
      border: 1px solid rgba(0,242,254,.35);
      appearance: none;
      outline: none;
    }

    .voice-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .voice-btn {
      height: 52px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(10,14,28,.75);
      color: rgba(200,215,235,.75);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .voice-btn.active {
      background: linear-gradient(135deg, rgba(0,242,254,.22), rgba(255,42,133,.22));
      border-color: var(--cyan);
      color: #fff;
    }

    .uid-badge {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(0,242,254,.14);
      border: 1px solid rgba(0,242,254,.4);
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s ease;
    }
    .uid-badge.show { opacity: 1; pointer-events: auto; }
    .uid-badge .num { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 15px; color: var(--cyan); }
    .uid-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); }
    .uid-badge .lbl { font-size: 10px; font-weight: 800; color: rgba(255,255,255,.7); }

    .welcome-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 24px;
      text-align: center;
      margin-top: 6px;
      color: #fff;
    }
    .meta { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
    .meta-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.06); font-size: 11px; }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
<div class="aurora">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="stage">
  <div class="phone" id="phone">
    <div class="frame-glow"></div>
    <div class="screen">

      <!-- ================= LOGIN VIEW ================= -->
      <div class="view" id="view-login">
        <div class="top">
          <h1 class="title">MOI</h1>
          <div class="tagline">Connect · Play · Vibe</div>
        </div>

        <div class="mascot-wrap">
          <svg class="mascot" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <radialGradient id="gHalo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".55"/><stop offset="52%" stop-color="#8b5cf6" stop-opacity=".2"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
              <radialGradient id="gEar" cx="38%" cy="28%" r="78%"><stop offset="0%" stop-color="#ffa3ce"/><stop offset="46%" stop-color="#ff2a85"/><stop offset="100%" stop-color="#9c0049"/></radialGradient>
              <radialGradient id="gHead" cx="34%" cy="24%" r="82%"><stop offset="0%" stop-color="#ff93c8"/><stop offset="42%" stop-color="#ff2a85"/><stop offset="100%" stop-color="#94003f"/></radialGradient>
              <radialGradient id="gFace" cx="42%" cy="28%" r="78%"><stop offset="0%" stop-color="#fff"/><stop offset="62%" stop-color="#ffe7f2"/><stop offset="100%" stop-color="#ffbcd8"/></radialGradient>
              <linearGradient id="gVisor" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#17253f"/><stop offset="55%" stop-color="#060b17"/><stop offset="100%" stop-color="#0e1d36"/></linearGradient>
              <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a6fbff"/><stop offset="45%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#008ba3"/></linearGradient>
              <linearGradient id="gArm" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff6aa8"/><stop offset="100%" stop-color="#c70060"/></linearGradient>
              <linearGradient id="gGloss" x1="0" y1="0" x2=".7" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity=".55"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
              <filter id="fEye" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <circle cx="120" cy="122" r="114" fill="url(#gHalo)"/>
            <ellipse class="orbit" cx="120" cy="122" rx="108" ry="32" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="4 11" opacity=".5"/>
            <circle cx="60" cy="66" r="27" fill="url(#gEar)"/><circle cx="60" cy="66" r="14" fill="#ffd3e6"/>
            <circle cx="180" cy="66" r="27" fill="url(#gEar)"/><circle cx="180" cy="66" r="14" fill="#ffd3e6"/>
            <circle cx="120" cy="126" r="78" fill="url(#gHead)"/>
            <ellipse cx="92" cy="82" rx="34" ry="19" fill="url(#gGloss)" transform="rotate(-24 92 82)"/>
            <ellipse cx="120" cy="144" rx="58" ry="46" fill="url(#gFace)"/>
            <ellipse cx="76" cy="152" rx="10" ry="7" fill="#ff2a85" opacity=".32"/>
            <ellipse cx="164" cy="152" rx="10" ry="7" fill="#ff2a85" opacity=".32"/>
            <path d="M108 152 Q120 164 132 152" stroke="#7a2044" stroke-width="4" stroke-linecap="round" fill="none"/>
            <rect x="58" y="106" width="124" height="40" rx="20" fill="url(#gVisor)"/>
            <rect x="58" y="106" width="124" height="40" rx="20" fill="none" stroke="#00f2fe" stroke-width="2" opacity=".85"/>
            <g class="eyes"><ellipse cx="96" cy="126" rx="9" ry="11" fill="#7df9ff" filter="url(#fEye)"/><ellipse cx="144" cy="126" rx="9" ry="11" fill="#7df9ff" filter="url(#fEye)"/></g>
            <rect class="scan" x="64" y="110" width="112" height="3" rx="1.5" fill="#ff2a85" opacity=".8"/>
            <path d="M46 122 C40 44, 200 44, 194 122" stroke="url(#gBand)" stroke-width="11" stroke-linecap="round" fill="none"/>
            <rect x="32" y="100" width="20" height="44" rx="10" fill="url(#gBand)"/>
            <rect x="188" y="100" width="20" height="44" rx="10" fill="url(#gBand)"/>
            <rect x="36" y="106" width="6" height="32" rx="3" fill="#fff" opacity=".4"/>
            <rect x="192" y="106" width="6" height="32" rx="3" fill="#fff" opacity=".4"/>
            <g class="arm"><path d="M166 172 Q208 170 214 130" stroke="url(#gArm)" stroke-width="22" stroke-linecap="round" fill="none"/>
              <circle cx="214" cy="128" r="14" fill="#ffa3ce"/><circle cx="214" cy="128" r="14" fill="none" stroke="#ff2a85" stroke-width="2" opacity=".55"/>
              <ellipse cx="209" cy="122" rx="5" ry="3.6" fill="#fff" opacity=".6"/></g>
          </svg>
        </div>

        <div class="card">
          <div class="divider">Login with</div>
          <button class="btn btn-google" type="button" id="googleBtn">
            <i class="fa-brands fa-google"></i><span>Continue with Google</span>
          </button>
          <button class="btn btn-facebook" type="button" id="facebookBtn">
            <i class="fa-brands fa-facebook-f"></i><span>Continue with Facebook</span>
          </button>
        </div>

        <div class="bottom">
          <div class="problems"><i class="fa-solid fa-circle-question"></i> Having problems?</div>
          <div class="terms">Agree and Continue &nbsp;·&nbsp; <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a></div>
        </div>
      </div>

      <!-- ================= PROFILE SETUP VIEW ================= -->
      <div class="view hidden" id="view-profile">
        <div>
          <div class="p-title">SETUP PROFILE</div>
          <div class="p-sub">Just a few more details</div>
          <div class="avatar-wrap"><div class="avatar" id="profileAvatar"><i class="fa-solid fa-user"></i></div></div>
          <div class="welcome-name" id="profileName">Guest</div>
        </div>

        <div class="profile-card">
          <div class="form-group">
            <label class="form-label">Your Country</label>
            <div class="select-wrap">
              <select id="countrySelect">
                <option value="">— Select Country —</option>
                <option value="Bangladesh">🇧🇩 Bangladesh</option>
                <option value="India">🇮🇳 India</option>
                <option value="Pakistan">🇵🇰 Pakistan</option>
                <option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
                <option value="UAE">🇦🇪 United Arab Emirates</option>
                <option value="USA">🇺🇸 United States</option>
                <option value="Other">🌍 Other</option>
              </select>
              <i class="fa-solid fa-chevron-down"></i>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Voice Preference</label>
            <div class="voice-row" id="voiceRow">
              <button type="button" class="voice-btn" data-voice="Male"><i class="fa-solid fa-mars"></i>Male</button>
              <button type="button" class="voice-btn" data-voice="Female"><i class="fa-solid fa-venus"></i>Female</button>
              <button type="button" class="voice-btn" data-voice="Neutral"><i class="fa-solid fa-circle-half-stroke"></i>Neutral</button>
            </div>
          </div>
        </div>

        <button class="btn btn-primary" type="button" id="saveProfileBtn">
          <i class="fa-solid fa-arrow-right"></i><span>Continue</span>
        </button>
      </div>

      <!-- ================= HOME VIEW ================= -->
      <div class="view hidden" id="view-home">
        <div class="top">
          <div class="p-title">WELCOME</div>
          <div class="p-sub">You are all set</div>
        </div>

        <div class="avatar-wrap" style="margin-top:0;">
          <div class="avatar" id="homeAvatar"><i class="fa-solid fa-user"></i></div>
        </div>
        <div class="welcome-name" id="homeName">—</div>

        <div class="meta" id="homeMeta"></div>

        <button class="btn btn-logout" type="button" id="logoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i><span>Sign Out</span>
        </button>
      </div>

      <!-- Persistent MOI ID Badge -->
      <div class="uid-badge" id="uidBadge">
        <span class="dot"></span>
        <span class="lbl">MOI ID</span>
        <span class="num" id="uidNum">------</span>
      </div>

    </div>
  </div>
</div>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, FacebookAuthProvider,
    signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import {
    getDatabase, ref, get, set
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
    authDomain: "room-7fbf7.firebaseapp.com",
    databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
    projectId: "room-7fbf7",
    storageBucket: "room-7fbf7.firebasestorage.app",
    messagingSenderId: "417946695868",
    appId: "1:417946695868:web:34c6f63269aaf659b2b8b9"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getDatabase(app);

  const googleProvider   = new GoogleAuthProvider();
  const facebookProvider = new FacebookAuthProvider();

  const $ = id => document.getElementById(id);
  const views = { login: $('view-login'), profile: $('view-profile'), home:$('view-home') };

  function showView(name){
    Object.keys(views).forEach(k => views[k].classList.toggle('hidden', k !== name));
  }

  let selectedVoice = '';
  document.querySelectorAll('.voice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedVoice = btn.dataset.voice;
    });
  });

  async function generateMoiId(){
    for (let i = 0; i < 25; i++){
      const num = Math.floor(100000 + Math.random() * 900000).toString();
      const snap = await get(ref(db, 'uids/' + num));
      if (!snap.exists()) return num;
    }
    return Date.now().toString().slice(-6);
  }

  function fillAvatar(el, user){
    if (user.photoURL){
      el.innerHTML = `<img src="${user.photoURL}" alt="">`;
    } else {
      el.innerHTML = `<i class="fa-solid fa-user"></i>`;
    }
  }

  function showUidBadge(uid){
    $('uidNum').textContent = uid \vert{}\vert{} '------';$('uidBadge').classList.add('show');
  }

  async function routeAfterLogin(user){
    const userSnap = await get(ref(db, 'users/' + user.uid));

    if (userSnap.exists() && userSnap.val().moiId){
      const data = userSnap.val();
      $('homeName').textContent = data.name || user.displayName || 'User';
      fillAvatar($('homeAvatar'), user);$('homeMeta').innerHTML = `
        <span class="meta-chip"><i class="fa-solid fa-flag"></i> ${data.country || '—'}</span>
        <span class="meta-chip"><i class="fa-solid fa-microphone"></i> ${data.voice || '—'}</span>
      `;
      showUidBadge(data.moiId);
      showView('home');
    } else {
      $('profileName').textContent = user.displayName || 'New User';
      fillAvatar($('profileAvatar'), user);
      showView('profile');
    }
  }

  $('saveProfileBtn').addEventListener('click', async () => {
    const user = auth.currentUser;
    if (!user) return alert('আগে লগইন করুন।');

    const country = $('countrySelect').value;
    if (!country) return alert('অনুগ্রহ করে আপনার দেশ সিলেক্ট করুন।');
    if (!selectedVoice) return alert('অনুগ্রহ করে ভয়েস প্রেফারেন্স সিলেক্ট করুন।');

    try {
      const moiId = await generateMoiId();

      await set(ref(db, 'users/' + user.uid), {
        name: user.displayName || 'User',
        email: user.email || '',
        photo: user.photoURL || '',
        country: country,
        voice: selectedVoice,
        moiId: moiId,
        createdAt: Date.now()
      });
      await set(ref(db, 'uids/' + moiId), user.uid);

      $('homeName').textContent = user.displayName || 'User';
      fillAvatar($('homeAvatar'), user);$('homeMeta').innerHTML = `
        <span class="meta-chip"><i class="fa-solid fa-flag"></i> ${country}</span>
        <span class="meta-chip"><i class="fa-solid fa-microphone"></i> ${selectedVoice}</span>
      `;
      showUidBadge(moiId);
      showView('home');

    } catch (err){
      alert('সেভ করতে সমস্যা হয়েছে: ' + err.message);
    }
  });

  $('googleBtn').addEventListener('click', async () => {
    try {
      const result = await signInWithPopup(auth, googleProvider);
      await routeAfterLogin(result.user);
    } catch (err){
      alert('গুগল লগইন সমস্যা: ' + err.message);
    }
  });

  $('facebookBtn').addEventListener('click', async () => {
    try {
      const result = await signInWithPopup(auth, facebookProvider);
      await routeAfterLogin(result.user);
    } catch (err){
      alert('ফেসবুক লগইন সমস্যা: ' + err.message);
    }
  });

  $('logoutBtn').addEventListener('click', async () => {
    await signOut(auth);
    $('uidBadge').classList.remove('show');
    showView('login');
  });

  onAuthStateChanged(auth, async (user) => {
    if (user){
      await routeAfterLogin(user);
    } else {
      $('uidBadge').classList.remove('show');
      showView('login');
    }
  });
</script>
</body>
</html>
